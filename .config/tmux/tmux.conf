# ==============================================================================
# Craftzdog-Style Tmux Configuration (OLED Transparent + Vim Keybinds)
# ==============================================================================

# True color & Ghostty undercurl support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -g default-shell /usr/bin/fish

# Prefix: Ctrl+A (fast ergonomics)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on

# Reload config with Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

# Intuitive splits keeping current path (| and - plus Craftzdog ss/sv)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim pane navigation (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim pane resizing (Prefix + Shift+H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Maximize pane toggle
bind m resize-pane -Z

# Floating Lazygit popup (Craftzdog/Omarchy workflow!)
bind g display-popup -E -w 88% -h 88% -d "#{pane_current_path}" "lazygit"

# Vi Copy Mode with Wayland clipboard (wl-copy)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Craftzdog Transparent OLED + Amber Status Bar
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#a1a1aa"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#ff8c38,bold]  #S #[fg=#3f3f46]│ "
set -g status-right "#[fg=#71717a]󰉋 #{b:pane_current_path} #[fg=#3f3f46]│ #[fg=#ff8c38,bold]%H:%M "

setw -g window-status-format "#[fg=#71717a] #I:#W "
setw -g window-status-current-format "#[fg=#08080a,bg=#ff8c38,bold] #I:#W #[default]"

set -g pane-border-style "fg=#27272a"
set -g pane-active-border-style "fg=#ff8c38"
set -g message-style "bg=#121216,fg=#ff8c38,bold"
