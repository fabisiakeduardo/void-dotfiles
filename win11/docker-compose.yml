services:
  windows:
    image: dockurr/windows
    container_name: windows11
    environment:
      VERSION: "11"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "128G"
      USERNAME: "eduardo"
      PASSWORD: "admin"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - /home/eduardo/win11/storage:/storage
      - /home/eduardo/shared-windows:/shared
    restart: unless-stopped
    stop_grace_period: 2m
