services:
  windows:
    image: dockurr/windows
    container_name: windows11
    environment:
      VERSION: "11"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "128G"
      USERNAME: "eduardo"
      PASSWORD: "admin"
      TZ: "America/Sao_Paulo"
      ARGUMENTS: "-rtc base=localtime,clock=host,driftfix=slew"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 127.0.0.1:8006:8006
      - 127.0.0.1:3389:3389/tcp
      - 127.0.0.1:3389:3389/udp
    volumes:
      - /home/eduardo/win11/storage:/storage
      - /home/eduardo/shared-windows:/shared
    restart: unless-stopped
    stop_grace_period: 2m
