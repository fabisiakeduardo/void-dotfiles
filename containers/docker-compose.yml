# Standard dev service containers — start only what you need:
#   docker compose up -d postgres
#   docker compose up -d redis mariadb
#   docker compose --profile db up -d      (all databases)
#   lazydocker in this dir for a TUI

services:
  postgres:
    image: postgres:18-alpine
    profiles: [db]
    environment:
      POSTGRES_USER: eduardo
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: [./data/postgres:/var/lib/postgresql/data]
    restart: unless-stopped

  mariadb:
    image: mariadb:12
    profiles: [db]
    environment:
      MARIADB_USER: eduardo
      MARIADB_PASSWORD: mariadb
      MARIADB_DATABASE: dev
      MARIADB_ROOT_PASSWORD: root
    ports: ["127.0.0.1:3306:3306"]
    volumes: [./data/mariadb:/var/lib/mysql]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    profiles: [db]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [./data/redis:/data]
    restart: unless-stopped

  mongodb:
    image: mongo:8
    profiles: [db]
    environment:
      MONGO_INITDB_ROOT_USERNAME: eduardo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports: ["127.0.0.1:27017:27017"]
    volumes: [./data/mongo:/data/db]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    profiles: [web]
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [db]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Devin1234!"
      MSSQL_PID: Developer
    ports: ["127.0.0.1:1433:1433"]
    volumes: [./data/mssql:/var/opt/mssql]
    restart: unless-stopped
